services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    ports:
      - "5432:5432"
    volumes:
      - crm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - crm_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/migrate", "-direction", "up"]
    environment:
      DATABASE_URL: postgres://crm:crm@postgres:5432/crm?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      APP_BASE_URL: http://localhost:3000
      APP_TIMEZONE: Asia/Jakarta
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://crm:crm@postgres:5432/crm?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: development-only-secret-change-this-32-bytes
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  crm_postgres:
  crm_redis:
